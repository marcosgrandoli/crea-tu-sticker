<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo degradado vibrante estilo App Icon moderno -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Brillo ambiental sutil -->
    <radialGradient id="glow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Degradado de la esquina doblada del sticker -->
    <linearGradient id="peelGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Degradado verde WhatsApp para las ondas de audio -->
    <linearGradient id="soundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Sombra suave para el sticker -->
    <filter id="stickerShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1E1B4B" flood-opacity="0.35" />
    </filter>

    <!-- Sombra para el doblez -->
    <filter id="peelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)" />

  <!-- Cuerpo principal del Sticker con esquina superior derecha recortada -->
  <g filter="url(#stickerShadow)">
    <path d="M 168 104 
             H 304 
             L 408 208 
             V 344 
             C 408 379.346 379.346 408 344 408 
             H 168 
             C 132.654 408 104 379.346 104 344 
             V 168 
             C 104 132.654 132.654 104 168 104 Z" 
          fill="#FFFFFF" />
  </g>

  <!-- Ecualizador / Ondas de sonido geométricas dentro del sticker -->
  <g transform="translate(0, 12)">
    <!-- Barra 1 -->
    <rect x="156" y="232" width="22" height="56" rx="11" fill="#1E1B4B" />
    <!-- Barra 2 -->
    <rect x="196" y="196" width="22" height="128" rx="11" fill="url(#soundGrad)" />
    <!-- Barra 3 (Central más alta) -->
    <rect x="236" y="172" width="22" height="176" rx="11" fill="#1E1B4B" />
    <!-- Barra 4 -->
    <rect x="276" y="204" width="22" height="112" rx="11" fill="url(#soundGrad)" />
    <!-- Barra 5 -->
    <rect x="316" y="238" width="22" height="44" rx="11" fill="#1E1B4B" />
  </g>

  <!-- Esquina doblada del sticker (Peel Effect) -->
  <path d="M 304 104 
           V 172 
           C 304 191.882 320.118 208 340 208 
           H 408 
           L 304 104 Z" 
        fill="url(#peelGrad)" 
        filter="url(#peelShadow)" />
</svg>